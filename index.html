<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <title>Security Breech</title>
    </head>
    <body>
        <div id="notif-box"></div>
        <div id="display-box">
            <div id="active-box">
                <h1>Generate a</h1>
                <h1 class="highlight">random password</h1>
                <h2>Never use an insecure password again.</h2>
                <div id="pw-length-box">
                    <label for="pw-length-slider">Length: </label><input type="range" min="8" max="40" value="15" id="pw-length-slider"><input type="number" min="8" max="40" value="15" id="pw-length-input">
                </div>
                <div id="pw-character-toggle-box">
                    <span>Includes: </span>
                    <input type="checkbox" id="pw-use-letters" checked disabled><label for="pw-use-letters">Letters</label>
                    <input type="checkbox" id="pw-use-numbers" checked><label for="pw-use-numbers">Numbers</label>
                    <input type="checkbox" id="pw-use-symbols" checked><label for="pw-use-symbols">Symbols</label>
                </div>
                <button id="the-button">Generate Passwords</button>
                <div class="the-line"></div>
                <div id="pw-result-box">
                    <button class="pw-result"></button>
                    <button class="pw-result"></button>
                    <button class="pw-result"></button>
                    <button class="pw-result"></button>
                </div>
                <div id="disclaimer">
                    <p>But I thought we shouldn't use pesudo-RNG for cybersecurity purposes...?</p>
                    <p>So uh... Do not actually use these passwords, this is for educational purposes only.</p>
                </div>
            </div>
        </div>
        <script type="module" src="main.js"></script>
    </body>
</html>
